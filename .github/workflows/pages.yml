# The website, on GitHub Pages: https://ilias-audio.github.io/rirdb/
#
# Built here, from the release tables alone (`rirdb dev site`, src/rirdb/site.py): every push to main rebuilds it.
# A new tables release reaches the site through its lock commit on main (publish the tables first, then push).
# Not on `release`: GitHub deploys to Pages only from main, so a run started by a release tag is refused.
# Nothing is committed and no database is needed.
# One-time setup (done): Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site from the release tables
        run: |
          python -m pip install .
          rirdb dev site --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
