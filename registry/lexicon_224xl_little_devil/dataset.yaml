expected:
  n_irs: 142
  n_rooms: 14
  note: 'readme.rtf: 71 true-stereo IRs in 14 programs (01 Concert Halls ... 14 Small Plates), 96 kHz 24-bit. Each true-stereo
    IR is two stereo files, from the left and the right input: 142 stereo IRs. Six files (Dark Hall V5, Rich Chamber V7
    and Rich Plate V7) are cut at 8.0 s while still decaying (T30 about 10 to 23 s), so their decay fits are truncated.
    Plate V4, Small Plate V4 and Bright Hall V5.R have no mid-frequency decay time either, as their mid-band decay stops
    about 68 dB down at about 4.7 s. In Small Room V3/V4 and Inverse Room V1/V2 a sweep residue 30-50 dB below the IR
    makes the broadband T30 (5-8 s) meaningless; use the mid-frequency decay time or EDT for those programs.'
