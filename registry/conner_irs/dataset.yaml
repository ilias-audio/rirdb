content: 'Hobbyist library of 738 IRs (v2.0.0): rooms, enclosed spaces, outdoor sites, plate, spring and hardware
  reverbs, plus instrument, object, speaker and synthesized IRs, captured with claps, pops and sweeps.'
expected:
  n_irs: 738
  n_rooms: 95
  note: 'The README counts 738 IRs of anything (rooms, objects, instruments, speakers, hardware, synthesized signals). The
    reader takes the 257 IRs of spaces, plates and springs less 5 (Tail Only) files, and the 24 JC-120 spring-reverb IRs
    filed under Speakers: 276 IRs in 95 spaces named from the file names (the author gives no room count).'
