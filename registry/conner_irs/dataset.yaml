homepage: https://github.com/itsmusician/IR-Library
defects:
- what: 'The author faded or gated most tails to digital zero, so where a noise or hum floor came first, the decay fit
    runs through it. In the JC-120 spring files cut at -42 to -60 dB, rt_mid (5 to 12 s) measures that floor: the spring
    decays in about 3.5 to 3.9 s, as its -30 and -36 files show.'
  files: 'JC-120 Spring [0-9]+s -(42|48|54|60)\.wav$'
- what: 'Phoenix Convention Center halls: T20 and T30 at 4 and 8 kHz (3.2 to 5.8 s) are a noise floor the author faded to
    digital zero, not the room (air absorption alone limits an 8 kHz decay to about 1.7 s). The mid-band decay of about
    7.3 s is plausible.'
  files: 'PCC North 300 Level (Exhibit|Prefunction) Hall'
