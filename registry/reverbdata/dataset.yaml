  where: '<space>/Documentation/Documentation/: plans with the sources (S1...) and receivers (Pos1...) marked, as JPG, PDF,
    PNG or BMP (no coordinates; none for Lux Fragil). <space>/README.txt: channel layout and rates. A <file>_metrics.txt
    beside every IR: SNR, EDT, T30, T20, T15 ... per octave band and channel, by the authors. The space pages of https://reverbdata.ipl.pt/
    give dimensions, volumes, seats, materials and the source and receiver placement.'
