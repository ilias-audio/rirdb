  caveats:
  - Free registration with manual checking; login details arrive by email and the data folder is password-protected,
    so we could not test the download.
  - The 2014-15 pages are marked 'under construction' and disagree on details (Vislab vs 'PATS Studio 2'; two vs
    three zones); a sibling Studio 2 set (SS2RD) is on the same site.
  - 51,840 IRs is derived from 60 loudspeakers x 864 microphones; each RIR is 32,767 samples at 48 kHz.
