notes: 'Measured (mains hum in the noise, early reflections that change with source position). The sampling rate is not
  stated: the length (60001 samples) and a 50 Hz hum harmonic fit 48 kHz, and also 96 kHz; 48 kHz is assumed (at 96 kHz
  every time measure would halve). The layout foa_fuma names the channel order (W X Y Z) only: the normalisation and the
  W gain are not stated, and the channel levels do not settle FuMa against N3D, so sh_norm is left empty. The source keys
  az000-az350 are nominal: at 0.5-2 kHz the direct sound''s azimuth is within 5 degrees of the name (up to 10 degrees broadband).
  The microphone''s orientation is not stated and the sources surround it, so no lateral fraction is published.'
content: A single MATLAB file of 36 measured first-order B-format (W X Y Z) room impulse responses from room 12BB01 at the
  University of Surrey, one per 10 degrees of source azimuth around one microphone position, used to make reverberant speech
  mixtures for a B-format speech-separation study.
