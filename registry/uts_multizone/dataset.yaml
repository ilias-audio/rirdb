adapter: {name: wav_tree, params: {glob: '*/*/*_Zone*_*MicrophoneArray_L*_M*.wav', pattern: '^(?P<room>[^/]+)/(?P<label>[^/]+)/[A-Za-z]+_(?P<rcv>Zone[A-E])_(?P<rcv_2>Circular|Planar)MicrophoneArray_(?P<src>L\d+)_(?P<rcv_3>M\d+)\.wav$', roles: {'1': [omni]}}}
capture_formats:
- mono_omni
cap: 500   # 104,160 IRs found, above 100,000 (data-model.md section 3): 500 per space, so 3,500 measured
defects:
- what: 'In the Hemi-anechoic Room, microphone M6 of the circular array recorded no signal in zone A: its 60 files (one
    per loudspeaker) hold no impulse response, only noise about 70 dB below microphones M5 and M7. The same microphone records
    normally in zone B and in the other rooms.'
  files: HemiAnechoicRoom_ZoneA_CircularMicrophoneArray_L\d+_M6\.wav$
content: 260,400 single-channel RIRs from a 60-loudspeaker circular array to two microphone arrays placed in 5 zones,
  measured with sine sweeps in 7 rooms (anechoic chamber to open-plan office) at UTS Tech Lab, Sydney.
fs_hz:
- 48000
expected:
  n_irs: 260400
  n_rooms: 7
  note: 'The authors state 260,400 RIRs (7 rooms x 5 zones x 60 loudspeakers x 124 microphones: 134,400 from the 64-microphone
    square array, 126,000 from the 60-microphone double-layer circular array). The seven room ZIPs as served (about 7.9
    GB, fetched 16 Nov 2026) hold zones A and B only, 14,880 files per room, so 104,160 are found and indexed. The record''s
    RO-Crate metadata (read 17 Nov 2026) lists ''UTS RIR Database/<room>.zip'' parts of 2.2 to 3.4 GB each (19.63 GB in
    all) and a combined ''UTS RIR Database.zip'' 1,742 bytes larger than their sum, as a ZIP holding the seven would be;
    it gives no size for the room ZIPs that were served. The served ZIPs are about 40% of the listed parts, the share of
    2 zones in 5, and use a flat <room>/<file> tree, while the authors'' readRIRintoMatlab.m reads <Room>/<Zone>/<Array>
    folders for ZoneA to ZoneE. So the listed parts probably hold all five zones, C-E included; they were not fetched.'
room_info:
  geometry: 'no'
  positions: partial
  conditions: 'no'
  where: 'the UTS Research Data Portal record (doi 10.26195/0wx8-v473) and its RO-Crate metadata: room names, loudspeaker
    and microphone arrays, equipment (Genelec 8010A, DPA 4060, Yamaha RIO interfaces), 3 s log sweep 20 Hz-22 kHz, the floor
    absorbers of the anechoic environment; room sizes, array geometry and zone positions are only in the JASA letter (Zhao
    et al. 2022, doi 10.1121/10.0014958, closed access)'
