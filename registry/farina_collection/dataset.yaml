analysis:
  keep_s: 3.3
expected:
  n_irs: 245
  n_rooms: 23
  note: No count is published. 245 IRs read once each from the WAV files of 23 spaces (B-format pairs joined); copies, test
    signals, two noise-dominated files, violin bodies, a convolved music file, recordings over 60 s and the 95 MLSSA .TIM
    files (La Scala, Parmalat and others) are left out.
content: Measured IRs (mono, stereo, binaural and B-format) from over 15 venues, mostly Italian theatres, concert
  halls and churches plus Vienna's Musikverein, in Angelo Farina's public web folder.
