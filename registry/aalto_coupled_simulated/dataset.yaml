  confidence: medium
  caveats:
  - All IRs sit in one 7.5 GB MATLAB file (srirs.mat).
  - The Zenodo record does not state the sample rate, the number of receivers or the spatial format; the file gives 32 kHz
    and 838 receivers, and its 9 channels per receiver are second-order Ambisonics. Neither the record nor the file states
    the channel order (ACN) or the normalisation (SN3D); RIRDB judged them from the channel levels of the direct sound,
    so sh_norm is left empty.
  - 'Simulated only: the file''s own description (srirDataset/type) puts the transition from wave-based to geometrical acoustics
    at 1 kHz; the web check of 14 October 2026 recorded about 750 Hz.'
  - The 838 IRs are stored as one compressed 7.46 GB array whose chunks span every receiver, so reading any one IR decompresses
    the whole file (about 40 s). RIRDB's reader reads the array whole once (about 44 s and 7.7 GB of memory) and keeps it
    for the following IRs, so rirdb get needs the full download and about 9 GB of free memory for this dataset (8.5 GB at
    peak in our test); get --dataset aalto_coupled_simulated alone copies the files as published without reading them.
