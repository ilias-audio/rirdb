# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: mckenzie_rtd
name: Room Transition Dataset (coupled rooms, Eigenmike)
year: 2021
type: measured
ir_kinds: [room]
capture_formats: [hoa_sh]
content: Spatial RIRs for 4 transitions between coupled rooms at Aalto (meeting room-hallway, office-anechoic chamber, office-kitchen, office-stairwell), 101 positions at 5 cm steps from 2.5 m inside one room to 2.5 m inside the other, 4 source positions each (LOS / no LOS, both rooms); Genelec 8331A, mh acoustics Eigenmike em32; published as 4th-order SH (25 ch), 1.5 s.
expected: {n_irs: 1616, n_rooms: 4, note: "4 transitions x 4 sources x 101 positions"}
room_info: {positions: "partial", images: "yes", where: "Chamber/Hallway/Kitchen/Stairwell.pdf room drawings"}
license: {spdx: CC-BY-4.0, redistribute_audio: yes}
access: open
# v1.3 = last raw release (v1.4 is denoised: modelled tails would bias decay metrics); WAV zip only (the SOFA
# zips hold the same SRIRs, 20 GB)
source: {kind: zenodo, records: ["6375520"], include: ["*WAV.zip"]}
keep_archive: false
wave: 2
adapter:
  name: wav_tree
  # Wav Files/<transition>/Source in <room>/<With|No> Line of Sight/RIR_<distance>cm.wav: 4th-order SH (25 ch,
  # ACN), 1.5 s at 48 kHz; SH normalisation and array orientation not documented -> no JLF
  params:
    pattern: 'Wav Files/(?P<room>[^/]+)/(?P<src>Source in [^/]+/(?:No|With) Line of Sight)/RIR_(?P<rcv>\d+cm)\.wav$'
    room_from: pattern
    roles: {25: [W, ACN1, ACN2, ACN3, ACN4, ACN5, ACN6, ACN7, ACN8, ACN9, ACN10, ACN11, ACN12, ACN13, ACN14, ACN15, ACN16, ACN17, ACN18, ACN19, ACN20, ACN21, ACN22, ACN23, ACN24]}
    channel_formats: {25: hoa_sh}
    orientation_known: false
homepage: https://zenodo.org/records/6375520
paper: {title: "Acoustic Analysis and Dataset of Transitions between Coupled Rooms (ICASSP 2021)", url: "https://doi.org/10.1109/ICASSP39728.2021.9415122"}
doi: 10.5281/zenodo.6375520
status: active
web_check:
  checked: '2026-10-14'
  institution: Aalto University
  country: Finland
  caveats:
  - 'Transitions between coupled rooms: decays change shape along each path and often have two slopes.'
