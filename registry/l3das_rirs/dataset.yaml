# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: l3das_rirs
name: L3DAS RIRs (L3DAS21/L3DAS22)
year: 2023
type: measured
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3   # onboarded by scripts/onboard
source: {"kind":"http","urls":["https://www.l3das.com/assets/file/L3DAS_RIRs.zip"]}
adapter: {name: wav_tree, params: {glob: L3DAS_RIRs/*.wav, pattern: '^L3DAS_RIRs/L3DAS_IR_(?P<rcv>[AB])_(?P<src>\d+)_-?[\d.]+_-?[\d.]+_-?[\d.]+\.wav$', room_from: pattern, room_default: office, capture_format: foa_ambix, roles: {4: [W, Y, Z, X]}, sh_norm: SN3D, orientation_known: false}}
capture_formats:
- foa_ambix
fs_hz:
- 32000
content: First-order Ambisonic (B-format) RIRs from 252 loudspeaker positions to two Ambisonic microphones in a
  furnished office of about 6 x 5 x 3 m, used to build the L3DAS21 and L3DAS22 challenge datasets.
expected:
  n_irs: 504
  n_rooms: 1
  note: '252 loudspeaker positions (168 on a 50 cm grid in 7 height layers, 84 random) x 2 microphones, as license.txt.txt
    and the L3DAS22 paper state. The IRs are 0.15 s long as published (4,800 samples at 32 kHz), cut while still decaying:
    in the trial the level falls only 17 to 23 dB from the 10 ms after the peak to the last 15 ms, so 2 of 6 loaded IRs
    say CHECK.'
