- foa_fuma
- mono_omni
fs_hz:
- 48000
expected:
  n_irs: 148
  n_rooms: 6
  note: 'counted from the measurement files (the record gives no count): church 42 (3 receivers x 7 sources x omni and B-format),
    classroom 28 (2 x 7 x 2), corridor 6 (3 x 2), car 8 (2 seats x 2 takes x 2), audio booth 32 and listening room 32 (16
    loudspeakers x 2)'
room_info:
  where: Measurements/RIR_proforma/*.pdf (source-receiver distances of the church and classroom; the scanned sheets PP_01,
    PP_03 and PP_04 give the equipment, the church's plan and the car's seats and distances) and ReadMe.txt (corridor distances);
    Make_input_file_from_measured.m in each reproduction room's Meas_files (loudspeaker angles and distances); the save_options
    and measurements.timestamp fields of each .mat struct
content: 'Supporting data for a listening test on the room-in-room effect: measured first-order B-format IRs of
  various environments and BRIR sets used to build the stimuli, plus MATLAB code and listener responses.'
license:
