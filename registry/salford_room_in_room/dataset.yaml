source: {kind: figshare, records: ["3457733"]}
adapter: {name: mat_struct, params: {glob: AES141_Room-in-room_supporting_data/Measurements/**/*.mat, pattern: 'Measurements/(?:(?P<room>Church|Classroom|Corridor_narrow)/Position_(?P<rcv>\d)_(?P<src>[A-G])_(?:Omni|SF)|(?P<room_2>Car)/(?P<rcv_2>Front_Pass|Rear_Pass_Middle)_(?:Omni|SF)(?:_(?P<cond>II))?|(?P<room_3>Newton_AudioBooth|Newton_ListeningRoom)/Unaltered_plus_height/Meas_files/(?:Omni|SF)_(?P<src_2>Spk_\d+))\.mat$', var: obj, field: measurements.ir, fs_field: device.fs, time_axis: 0, channel_formats: {1: mono_omni, 4: foa_fuma}, roles: {1: [omni], 4: [W, X, Y, Z]}, sh_norm: FuMa, orientation_known: false, ir_kind_from_regex: {/Measurements/Car/: vehicle}}}
