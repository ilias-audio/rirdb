    both are left out.'
room_info:
  volume: 'no'
  images: 'yes'
  reference_acoustics: 'yes'
  where: 'readme.docx (folders, processing: 800 Hz-96 kHz sweep, Kirkeby inversion, octave filters, noise tail replaced,
    air absorption corrected to full scale), process_impulse_responses.m (gains), JOAS_derived_acoustic_parameters.xlsx
    (EDT, T30, C80, D50, G per position; the stone groups of each configuration); positions in Fig. 2 of Cox, Fazenda, Greaney
    2020, J. Archaeol. Sci. 122, 105218'
