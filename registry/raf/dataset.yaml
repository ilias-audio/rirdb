content: About 86,000 RIRs (47k in the empty and 39k in the furnished configuration of one room) from a 36-microphone "Earful Tower", with multi-view images and 6DoF tracking of emitters and listeners (audio-visual room acoustics).
expected:
  n_irs: 86616
  n_rooms: 1
  note: 'Paper section 3.1: 47K RIRs in the empty room and 39K in the furnished room; the files hold 47,484 and 39,132 mono
    WAVs, one per microphone of the 36-microphone tower (1,319 and 1,087 blocks of 36, one tracked loudspeaker pose each).
    One room in two conditions (Figure 2 draws one outline for both). The paper says the RIRs are 4 s long; the released
    files are 1.5 s.'
license: {spdx: CC-BY-NC-4.0, redistribute_audio: yes, note: "README and LICENSE.md: CC BY-NC 4.0 (checked 2026-10-13)."}
notes: "The recordings' noise floor is only 45-65 dB below the peak, highest at low frequencies (around 100 Hz): T30
  is valid at 500 Hz in 66 % (empty) and 43 % (furnished) of IRs and at 125 Hz in 16 % and 3 %, so rt_mid often comes
  from T20 and most IRs grade B or C."
homepage: https://facebookresearch.github.io/real-acoustic-fields/
