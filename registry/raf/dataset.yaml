defects:
- what: 'Three furnished-room blocks hold only background noise, no impulse response: the peak is about 1e-4, 43 dB below
    the median IR''s, and only 4 to 7 dB above the noise at the end of the file, at all 36 microphones. They are the three
    loudspeaker rotations at its top height (1.62 m) at one location, 0.7 m from the tower; the same location at 1.12 and
    1.37 m gave normal IRs.'
  files: FurnishedRoom/data/(00046[89]|0004[7-9]\d|00050[0-3]|0066[6-8]\d|00669[0-5]|02800[89]|0280[1-3]\d|02804[0-3])/
- what: In the furnished room, the loudspeaker pose and the 36 microphone positions given for these IRs are a byte copy
    of those of folders 014652 to 014687, but the recordings differ (their first 0.1 s do not correlate, on 4 microphones
    checked) and their loudest early arrival comes about 7 ms later. The tower stood at that placement for 90 blocks, and
    the weak first arrival fits the given distances, so the microphone positions and the loudspeaker's location are about
    right; its height and rotation for these IRs are not known.
  files: FurnishedRoom/data/0179(6[4-9]|[7-9]\d)/
