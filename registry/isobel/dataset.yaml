# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: isobel
name: ISOBEL Sound Field Dataset
year: 2021
type: measured
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3   # onboarded by scripts/onboard
source: {kind: zenodo, records: ["4501339"]}
adapter: {name: ndarray, params: {groups: [{glob: '*/*_SoundField_IRs/source_*/h_*/*.mat', container: mat, array: ImpulseResponse, time_axis: 0, fs: 48000, pattern: '^(?P<room>[^/]+)/[^/]+_SoundField_IRs/(?P<src>source_\d)/(?P<rcv>h_\d+/idxX_\d+_idxY_\d+)\.mat$'}, {glob: '*/*_Reverb_IRs/**/*.mat', container: mat, array: ImpulseResponse, time_axis: 0, fs: 48000, pattern: '^(?P<room>[^/]+)/[^/]+_Reverb_IRs/(?P<rcv>(?:h_\d+/)?(?P<src>(?:Omni|Woofer|Src)Pos_\d+)_MicPos_\d+)\.mat$'}]}}
capture_formats:
- mono_omni
content: 23,174 measured single-channel RIRs on 32x32 horizontal grids (1 to 1.9 m high) covering four rooms in
  Denmark, two sources per room, plus ISO 3382-2 reverberation-time measurements.
fs_hz:
- 48000
expected:
  n_irs: 23450
  n_rooms: 4
  note: '23,174 sound-field IRs (the authors'' count: 2 woofers x the reachable points of a 32x32 grid x 1 to 4 heights)
    + 276 IRs of the ISO 3382-2 reverberation measurements; the raw sweep recordings are left out'
room_info:
  dimensions: 'yes'
  volume: 'yes'
  geometry: partial
  positions: partial
  images: partial
  reference_acoustics: 'yes'
  where: '<room>/<Room>_MeasurementReport.pdf (Room B: RoomB_Measurements.pdf): address, dimensions, photos, grid steps,
    heights, source and microphone positions, T20'
license:
  spdx: CC-BY-4.0
homepage: https://zenodo.org/records/4501339
doi: 10.5281/zenodo.4501339
web_check:
  checked: '2026-10-14'
  found_as: ISOBEL Sound Field Dataset
  availability: open
  families:
  - mono
  host: Zenodo
  size: 39.2 GB
  file_formats: MAT (.mat, double) in one ZIP
  institution: Aalborg University and Bang & Olufsen (ISOBEL project)
  country: Denmark
  evidence_urls:
  - https://zenodo.org/api/records/4501339
  - https://zenodo.org/records/4501339/files/ISOBEL_SF_Dataset.zip?download=1
  - https://arxiv.org/abs/2102.06455
  - https://ar5iv.labs.arxiv.org/html/2102.06455
  - https://vbn.aau.dk/da/publications/deep-sound-field-reconstruction-in-real-rooms-introducing-the-iso
  confidence: high
  caveats:
  - One 39 GB ZIP; the IRs are MATLAB .mat files (double precision, 48 kHz).
  - Grids are horizontal planes at 1 to 1.9 m height, made for low-frequency sound-field reconstruction.
  - Room details are in measurement reports inside the ZIP; Room B comes from an earlier study (Lluis et al., JASA
    2020).
