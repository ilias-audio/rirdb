# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: sriracha
name: SRIRACHA
year: 2025
type: measured
ir_kinds: [room]
capture_formats: [array_raw]
content: 2,654,720 single-channel RIRs of sources in a plane parallel to a planar mic array in a shoebox room, 8 scenarios (2 distances x 2 source arrangements x 2 absorption levels).
expected: {n_irs: 2654720, n_rooms: 1, note: "the 20 published files hold 1,327,360, half the authors count"}
room_info: {dimensions: "yes", volume: "yes", geometry: "yes", positions: "yes", conditions: "yes", where: "room-geometry.stl in the record; SRIRACHA preprint (6.22 x 3.85 x 3.07 m concrete shoebox); robot source/receiver planes in the HDF5"}
license:
  spdx: CC-BY-NC-SA-4.0
  statements:
  - licence: CC-BY-SA-4.0
    where: DepositOnce record
  - licence: CC-BY-NC-SA-4.0
    where: the preprint in the same record
  redistribute_audio: "yes"
  note: 'Conflicting statements: the strictest is used. Ask the authors to confirm.'
access: open
source: {kind: depositonce, records: ["d9d4b747-2f3e-4b21-b32e-48863e9af876"]}
adapter:
  name: ndarray
  # data/impulse_response[1024 sources, 64 mics, 32000 samples] per scenario file (1 s at 32 kHz)
  params: {glob: "SR*.h5", container: h5, array: data/impulse_response, time_axis: 2, record_axes: [0, 1],
           fs_dataset: metadata/sampling_rate, pattern: '(?P<cond>SRA?\d-(?:C\d|D))\.h5$', room_default: sriracha-shoebox}
wave: 3
analysis: {scope: subsample_v1}
cap: 500
homepage: https://depositonce.tu-berlin.de/items/d9d4b747-2f3e-4b21-b32e-48863e9af876
doi: 10.14279/depositonce-23943
paper: {title: "SRIRACHA: Shoebox Room Impulse Response Archive with Varying Absorption", url: "https://api-depositonce.tu-berlin.de/server/api/core/bitstreams/643a8b38-bc2e-43cb-89e8-f972ed4457f8/content"}
status: active
web_check:
  checked: '2026-10-14'
  institution: TU Berlin
  country: Germany
  host: DepositOnce (TU Berlin)
  licence_note: The DepositOnce record says CC BY-SA 4.0, but the authors' preprint in the same record says CC BY-NC-SA
    4.0. Treat it as non-commercial until the authors confirm.
  caveats:
  - The 20 published files hold 1,327,360 IRs, half the 2.65 million announced.
  - The IRs are 1 s long at 32 kHz.
