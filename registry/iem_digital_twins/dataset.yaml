    holds only a 33 MB Assets.zip, and the project page gives its size as ''xx GB''). The cathedral''s 31 files are 16 source-receiver
    paths, 15 of them also from a second sweep (kept, not preferred). The reader reads 130 (cathedral and studio): the meeting-room
    and lecture-hall MATLAB arrays (IRuntreated, 35000 x 12 x 25 x 12 and 35000 x 12 x 32 x 12) are not read until their
    I/O spreadsheets say which axis is which.'
