- binaural
- mono_omni
fs_hz:
- 48000
defects:
- what: 'Three SOFA files state the other loudspeaker''s source position: LS-Side (session 1, BRIRs and RIRs) states the
    front loudspeaker''s (0, 0, 1.55) and LS-Front_Reverse the side loudspeaker''s (5.5, -1.5, 1.55). The room plan and
    the first arrivals put the front loudspeaker at (0, 0) and the side one at (5.5, -1.5) in both sessions, so the source
    positions and distances of these IRs are wrong.'
  files: LS-Side\.sofa$|LS-Front_Reverse\.sofa$
content: KEMAR 45BA BRIRs at 16 positions along a 7.5 m line in a seminar room (9.9 x 4.7 x 3.1 m, T60 1.0 s) for
  two loudspeakers, head turned in 4° steps, in two sessions, plus omni RIRs; MATLAB and SOFA.
