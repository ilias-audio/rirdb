source: {kind: zenodo, records: ["3457798"]}
adapter: {name: sofa, params: {exclude: (^|/)(__MACOSX|\._)|\.DS_Store$, groups: [{glob: BRIRs_*.sofa, pattern: '^BRIRs_(?P<room>Seminar)(?P<room_2>Room)_LS-(?P<src>Front|Side)(?:_(?P<cond>Reverse))?\.sofa$', room_from: pattern, m_is: rcv, capture_format: binaural, roles: [L, R]}, {glob: RIRs_*.sofa, pattern: '^(?P<rcv>RIRs)_(?P<room>Seminar)(?P<room_2>Room)_LS-(?P<src>Front|Side)\.sofa$', room_from: pattern, m_is: rcv, capture_format: mono_omni, roles: [omni]}]}}
