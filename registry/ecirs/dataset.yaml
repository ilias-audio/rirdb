# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: ecirs
name: 'ECIRS: Ecophon Classroom Impulse Response Set'
year: 2025
type: measured
ir_kinds: [room]
capture_formats: [mono_omni]
status: active
content: 414 mono IRs measured in one real classroom under 23 configurations of Ecophon ceiling and wall absorbers
  and diffusers, each with 2 source and 9 receiver positions (WAV); all files fetched, with the configuration
  table (XLSX) and the T20/C50 plots.
fs_hz: [48000]
expected:
  n_irs: 414
  n_rooms: 1
  note: one classroom; the 23 treatment configurations are conditions of it, not separate spaces
room_info:
  dimensions: 'no'
  volume: 'no'
  geometry: 'no'
  materials: partial
  positions: 'no'
  images: 'no'
  reference_acoustics: partial
  conditions: 'yes'
  where: ECIRS_IR_Configurations_Description.xlsx lists, for each of the 23 configurations, which ceiling rows and which wall absorbers and diffusers were in place
license:
  spdx: CC-BY-4.0
  redistribute_audio: 'yes'
access: open
source: {kind: zenodo, records: ["16947513"]}
adapter:
  name: wav_tree
  # Impulse Responses/Conf <n>/Conf<n>_S<1|2>ER<1-8>.wav and Conf<n>_S<1|2>_ER_RoomCenter.wav;
  # one classroom, so no room group: the configuration is the condition
  params:
    glob: 'Impulse Responses/**/*.wav'
    pattern: '/(?P<cond>Conf \d+)/Conf\d+_(?P<src>S\d)_?(?P<rcv>ER\d|ER_RoomCenter)\.wav$'
    room_from: pattern
    room_default: ecirs-classroom
wave: 3
homepage: https://zenodo.org/records/16947513
paper: {title: "The ECIRS (Ecophon Classroom Impulse Response Set) - Data collection and perceptual tests performed on the influence of early reflections (Inter-Noise 2025)", url: "https://doi.org/10.3397/IN_2025_1075441"}
doi: 10.5281/zenodo.16947513
web_check:
  checked: '2026-10-14'
  found_as: 'ECIRS: Ecophon Classroom Impulse Response Set'
  availability: open
  families:
  - mono
  host: Zenodo
  size: 108 MB
  file_formats: WAV in ZIP, XLSX configuration table, PNG plots
  institution: Saint-Gobain Ecophon; Universidad Politécnica de Madrid
  country: Unknown
  evidence_urls:
  - https://zenodo.org/records/16947513
  - https://zenodo.org/api/records/16947513
  - https://zenodo.org/records/16947513/preview/ECIRS_FullDatabase_ImpulseResponses.zip
  - https://zenodo.org/records/16947513/files/ECIRS_IR_Configurations_Description.xlsx
  - https://zenodo.org/records/16947513/files/Plots%20Disclaimer.txt
  confidence: high
  caveats:
  - The record does not state the sample rate, the room size or where the classroom is.
  - Receivers are only labelled (ER1-ER8 and room centre); no coordinates are given.
  - The T20 and C50 plots show one source-receiver case only.
