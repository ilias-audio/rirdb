content: Hardware reverb units (Lexicon, EMT, spring, tape echo), speakers/telephones and a few spaces (forest, street, factory hall); site offline, archived on the Wayback Machine as StuffIt archives.
license: {spdx: LicenseRef-unspecified, redistribute_audio: unknown, note: "Stated as free to use in any convolver."}
defects:
- what: 'Mains hum (100 Hz) and a noise floor only about 40 dB below the response at 500 Hz, faded out over the file''s
    2.9 s: the analyser reads the fade as decay (T30 at 500 Hz about 1.9 s, rt_mid 1.0 s), while the handset decays in
    about 0.1 s (EDT 0.11 s, T20 0.14 s).'
  files: 'telephone horn T65\.C\.wav$'
homepage: https://web.archive.org/web/2012/https://fokkie.home.xs4all.nl/IR.htm
notes: "Only the 5 sets published as WAV are read (61 IRs). The 13 others (Domestic, Mercedes van, forest, streets, Lexicon
  PCM60 and 200, Roland DEP3 and RE-201, Fostex 3180, Master Room II, Vintage Spring Reverb, Buiksloterkerk, Small Factory
  Hall) exist only as StuffIt (.sit) archives of Sound Designer II files, which rirdb cannot read yet (deferred.md, item
  28)."
