  n_rooms: 1
  n_irs: 73872
  note: 4,104 loudspeaker grid positions (24 x 19 x 9) x 6 arrays x 3 T60 settings; each IR has the 5 microphones of one
    linear array as channels. The 25 out-of-grid positions and the loudspeaker microphone (31) are only in the raw recordings,
    not in the tensors.
