# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: dcase2025_task4_foa
name: DCASE2025Task4Dataset (FOA RIRs)
year: 2025
type: measured
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3
source: {"kind": "zenodo", "records": ["15117227"], "urls": ["https://zenodo.org/records/15117227", "https://zenodo.org/api/records/15117227/files/DCASE2025Task4Dataset.zip/content", "https://zenodo.org/api/records/15117227/files/DCASE2025Task4Dataset.z01/content", "https://zenodo.org/api/records/15117227/files/LISENCEv2.2.pdf/content"]}
adapter: {name: sofa, params: {groups: [{glob: final_0402_1/DCASE2025Task4Dataset/dev_set/room_ir/*/dcase2025-task4-rir_pid*.sofa, pattern: '^dcase2025-task4-rir_(?P<room>pid\d{4})\.sofa$', capture_format: foa_ambix, roles: [W, Y, Z, X], sh_norm: SN3D, orientation_known: false, first_per_source: true}, {glob: final_0402_1/DCASE2025Task4Dataset/dev_set/room_ir/*/foa-meir_*.sofa, pattern: '^(?P<room>foa-meir_(?:reverb-c|test)_pid\d{4})\.sofa$', capture_format: foa_ambix, roles: [W, Y, Z, X], sh_norm: SN3D, orientation_known: false, first_per_source: true}]}}
capture_formats:
- foa_ambix
expected:
  n_irs: 1152
  note: Development set only. 4 new NTT places x 72 (18 azimuths x 2 elevations x 2 distances) = 288, and 4 FOA-MEIR places
    x 216 = 864. The challenge paper (arXiv 2506.10676, Sec. 3.4.2) counts 540 new RIRs, 5 positions x 108 (with -20 deg
    elevation) in 3 rooms; the Zenodo record says six environments. Which places share a room is not published, so each
    place is a space (8).
room_info:
  dimensions: 'no'
  volume: 'no'
  positions: partial
  where: the SOFA files (SourcePosition relative to the microphone; Title gives the place id), the challenge paper (arXiv
    2506.10676, Sec. 3.4.2) and, for the FOA-MEIR places, FOA-MEIR's placeinfo.csv
defects:
- what: 'The files state AmbiX with SN3D normalisation, but they are the plain sum and difference of the four A-format capsules
    (NTT''s convertAB, no scaling): on the direct sound the first-order channels X, Y and Z are about 0.64 of their SN3D
    level against W (about -3.9 dB; SN3D gives |X,Y,Z| = |W| for a plane wave). Scale X, Y and Z by about 1.6 before decoding
    them as SN3D. The channel order (W, Y, Z, X) and the directions are right.'
content: First-order Ambisonic RIRs (Sennheiser Ambeo VR, SOFA, 32 kHz) measured by NTT in six environments, plus
  curated FOA-MEIR RIRs, shipped in the DCASE2025 Task 4 development set with sound events and noise.
fs_hz:
- 32000
license:
  spdx: LicenseRef-custom
  note: The terms are NTT's own, in LICENSEv2.2.pdf (named LISENCEv2.2.pdf on Zenodo), and Zenodo classes them as
    Other (Non-Commercial); read the PDF before reuse.
homepage: https://zenodo.org/records/15117227
doi: 10.5281/zenodo.15117227
web_check:
  checked: '2026-10-14'
  found_as: 'NTT DCASE2025 (and DCASE2026) Task 4 datasets: measured FOA RIRs'
  availability: open
  families:
  - ambisonic
  host: Zenodo
  size: 9.0 GB
  file_formats: SOFA (RIRs) inside a 17-part split ZIP
  institution: NTT Corporation
  country: Japan
  evidence_urls:
  - https://zenodo.org/api/records/15117227
  - https://zenodo.org/records/15117227
  - https://github.com/nttcslab/dcase2025_task4_baseline
  - https://dcase.community/challenge2025/task-spatial-semantic-segmentation-of-sound-scenes
  - https://arxiv.org/html/2506.10676v1
  - https://zenodo.org/api/records/19328046
  confidence: medium
  caveats:
  - The RIRs are in the room_ir folder of a 9 GB split ZIP that also holds sound events and noise. You need all
    17 parts to extract it.
  - 'Some of the RIRs are repackaged from NTT''s FOA-MEIR. No total RIR count is given: the record says six environments,
    while the challenge paper reports 540 new RIRs at 5 positions in 3 rooms.'
  - The DCASE2026 Task 4 edition (Zenodo 19328046, about 10.8 GB, same non-commercial label) also contains real-room
    FOA RIRs.
