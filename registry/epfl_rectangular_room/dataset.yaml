  - The data are transfer functions in a MATLAB .mat file. The supplied MATLAB scripts turn them into RIRs.
  - The original sampling rate is 4 kHz, so the data suit low-frequency (room-mode) work, not full-band reverb.
  - The companion GitHub code has no licence file. The data on Zenodo are CC BY 4.0.
