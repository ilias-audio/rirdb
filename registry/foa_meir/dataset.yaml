notes: "The authors give no reverberation times. The IRs are cut to 1 s, which leaves only 35-50 dB of decay in the
  rooms near 1 s (Atria 1 and 2, Hall 2, Hallway 2), and Office 1 has a higher noise floor, so these rooms hold most
  of the C grades and the IRs without rt_mid. In Meeting rooms 3 and 4 and Hallways 4 and 5 the T30 rises above 1 kHz
  (Meeting room 4: 0.71 s at 1 kHz, 1.49 s at 4 kHz) while the EDT stays short: a weak, slow high-frequency tail that
  is in the recordings, not noise."
