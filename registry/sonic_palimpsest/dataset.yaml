# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: sonic_palimpsest
name: Sonic Palimpsest Impulse Response Library
year: 2022
type: measured
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3   # onboarded by scripts/onboard
source: {"kind":"http","urls":["https://drive.usercontent.google.com/download?id=1utDu8wCdpj6fj0AlXNMXMIeWgn93arEF&export=download&confirm=t#sonic_palimpsest_ir_library.zip"]}
adapter: {name: wav_tree, params: {glob: Sonic Palimpsest -Impulse Response Library/**/*.wav, pattern: '^Sonic Palimpsest -Impulse Response Library/(?:[^/]+/)+(?:(?P<room>0[3-6][a-f])|(?P<room_2>0[12])(?P<rcv>[ab])?|(?P<room_3>07)(?P<src>[a-c]))[-_](?:Cavalier_(?:Rear|Front)Mess(?P<rcv_2>0[12])-)?[^/]*?(?:(?P<rcv_3>DPA) ?4061|(?P<rcv_4>KM184)|(?P<rcv_5>ST)(?:450|540))(?:-(?P<rcv_6>Centre|CentreInwards|Distant|MidSpace|NorthSide)-)?[^/]*\.wav$', room_from: pattern, format_from_regex: {'(?i)ST(?:450|540)\W*Binaural': binaural}, channel_formats: {'2': stereo}, layout_from_regex: {'(?i)ST(?:450|540)\W*Binaural': {'2': {roles: [L, R]}}}, room_from_regex: {'/06a-CHouse-Cellar-KM184-': '06b', '/06b-CHouse-Billiard Room-KM184-': '06a'}}}
capture_formats:
- stereo
- binaural
fs_hz:
- 48000
room_info:
  images: 'yes'
  where: 'the project page (https://research.kent.ac.uk/sonic-palimpsest/impulse-responses/: the spaces, microphones and
    capture matrix), the photos and plans in each site folder (01-Ropery.jpg, 02-TYS.png, 03-#3Slip.png, 04-CavalierMess.png,
    05-O Class layout.jpeg, 06*.jpg, AirRaidShelter.jpg/.png) and the authors'' info file in the 07 DPA folder'
content: Stereo IRs (DPA 4061 and Neumann KM184 pairs) and stereo and binaural decodes of SoundField ST450 captures, of
  15 spaces at Chatham Historic Dockyard, incl. a ropery, a destroyer and a submarine. All 44 files have two channels; the
  pack holds no Ambisonic (B-format) files.
expected:
  n_rooms: 15
  note: The authors give no IR count. The library holds 44 two-channel WAV files, one IR each, from the 15 spaces the project
    page lists (the Ropery, the Tarred Yarn Store, No. 3 Covered Slip mezzanine and ground, HMS Cavalier rear and front
    mess, HMS Ocelot front and rear, six rooms of the Commissioner's House, the Air Raid Shelter).
license:
  spdx: CC-BY-4.0
homepage: https://research.kent.ac.uk/sonic-palimpsest/impulse-responses/
web_check:
  checked: '2026-10-14'
  found_as: Sonic Palimpsest IR library (Chatham Historic Dockyard)
  availability: open
  families:
  - stereo
  - ambisonic
  - binaural
  host: Google Drive
  size: about 30 MB (WAV ZIP, as shown by Google Drive)
  file_formats: WAV in a ZIP; a second ZIP in Altiverb format
  institution: University of Kent (Sonic Palimpsest project)
  country: UK
  evidence_urls:
  - https://research.kent.ac.uk/sonic-palimpsest/impulse-responses/
  - https://drive.google.com/file/d/1utDu8wCdpj6fj0AlXNMXMIeWgn93arEF/view?usp=sharing
  - https://drive.google.com/file/d/1_jwj9PVNx8ZtpGzWMjoW-0u0prMnHc66/view?usp=sharing
  - https://drive.usercontent.google.com/download?id=1utDu8wCdpj6fj0AlXNMXMIeWgn93arEF&export=download
  confidence: high
  caveats:
  - Both packs are ZIP files on Google Drive, linked from the project page; sample rate and number of IRs are not
    stated.
  - Only a few sweep-measured spaces (Ropery, Tarred Yarn Store, No. 3 Slip) have SoundField Ambisonic captures;
    the ships, submarine, house and air-raid shelter were captured with bursts on stereo mics.
  - The capture matrix on the page is hard to read, so per-space microphone coverage is approximate.
