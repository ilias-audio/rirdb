  HDF5. The same grid measured with the second loudspeaker (Odeon Omni, 900 more RIRs, record DTU.21740645) is still to
  be added.
fs_hz:
- 48000
expected:
  n_irs: 900
  n_rooms: 1
  note: 'The Dynaudio record (DTU.21740453) only: its 900 RIRs (RIRs_bottom, one per grid point); the 36 noise recordings
    and the sweep signal are left out. The authors measured the same grid with a second loudspeaker (Odeon Omni, 900 more
    RIRs) in record DTU.21740645, which is not included yet.'
