# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: cavemove
name: CAVEMOVE
year: 2025
type: measured
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3   # onboarded by scripts/onboard
source: {kind: zenodo, records: ["17404917"]}
adapter: {name: wav_tree, params: {glob: cavemove_dataset/*/*/*IRs/*.wav, pattern: '^cavemove_dataset/(?P<room>[^/]+)/(?P<rcv>array|distributed)/(?:IRs/(?P<src>[a-z0-9]+)_|(?P<src_2>radio)_IRs/)(?P<cond>w[0-3])\.wav$', channel_formats: {8: array_raw}}}
ir_kinds:
- vehicle
space_type: vehicle
capture_formats:
- array_raw
content: 8-channel IRs measured in parked cars (4 models in the paper) from a talk-box at the seats and from the
  car audio, with a compact dashboard array and distributed mics, plus driving and ventilation noise; 16 kHz WAV.
fs_hz:
- 16000
expected:
  n_rooms: 4
  n_irs: 198
  note: 176 TalkBox IRs (driver, front and rear passengers, with shifted, raised and rotated variants) and 22 car-audio
    IRs, each per window state w0-w3, as listed per car and setup in dataset_documentation.pdf section 6; the Alfa Romeo
    has the distributed setup only and no car audio. Noise, ventilation and uncontrolled recordings are not IRs.
room_info:
  dimensions: 'no'
  volume: 'no'
  geometry: 'no'
  materials: 'no'
  positions: partial
  reference_acoustics: 'no'
  conditions: 'yes'
  where: 'dataset_documentation.pdf (section 5: seat and window codes; section 6: per car and setup the IR list, microphone
    positions in figures, driver and passenger offsets); info.json per car (make, model, year)'
license:
  spdx: CC-BY-4.0
homepage: https://zenodo.org/records/17404917
doi: 10.5281/zenodo.17404917
web_check:
  checked: '2026-10-14'
  found_as: 'CAVEMOVE: acoustic database for voice-enabled technologies inside moving vehicles'
  availability: open
  families:
  - array
  host: Zenodo
  size: 7.6 GB
  file_formats: 8-channel WAV (16 kHz, 24-bit) in one ZIP, info.json/info.mat per car, PDF documentation; Python/MATLAB
    API on GitHub (MIT)
  institution: FORTH Institute of Computer Science; Hellenic Mediterranean University
  country: Greece
  evidence_urls:
  - https://zenodo.org/records/17404917
  - https://zenodo.org/api/records/17404917
  - https://zenodo.org/records/17404917/preview/cavemove_dataset.zip
  - https://github.com/SPL-FORTH-ICS/CAVEMOVE
  - https://arxiv.org/abs/2508.19691
  - https://arxiv.org/html/2508.19691
  confidence: high
  caveats:
  - Only part of the recorded collection is public, resampled to 16 kHz/24-bit (recorded at 48 kHz).
  - The IRs come in one 7.6 GB ZIP with the noise recordings. No dry speech is included.
  - The record says four cars in one sentence and three in another. The paper lists four, and the ZIP preview (truncated)
    shows three car folders.
