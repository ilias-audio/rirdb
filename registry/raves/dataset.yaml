# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: raves
name: "RAVes: Room Acoustic Variances"
year: 2026
type: measured
ir_kinds: [room]
capture_formats: [sdm_array, binaural]
content: SRIRs and BRIRs of a 5.0 loudspeaker layout (ITU-R BS.2159, r=2 m) in 7 rooms (RT 0.21-1.20 s plus a lecture hall and a foyer), at middle, wall and edge listening positions.
expected: {n_rooms: 7, note: "19 positions in 7 rooms x 5 loudspeakers, as SRIRs and as BRIRs for 72 head orientations (6,840 BRIRs); rirdb indexes every SRIR and the frontal BRIR orientation only: 95 + 95 records"}
room_info: {positions: "yes", images: "yes", reference_acoustics: "partial", where: "SOFA source and listener positions; floor plans; reverberation times per room in the description"}
license: {spdx: CC-BY-4.0, redistribute_audio: yes}
access: open
source: {kind: zenodo, records: ["19809790"], include: ["SRIRs_*.zip", "BRIRs_*.zip", "Floor_plans.zip"]}
adapter:
  name: sofa
  params:
    groups:
      # 72 head orientations x 5 loudspeakers per file: analyse the frontal orientation (m = 0)
      - {glob: "BRIRs_*/**/*.sofa", pattern: 'BRIRs_(?P<room>.+)_(?P<rcv>[EMW])\.sofa$', roles: [L, R],
         capture_format: binaural, m_select: [0], preferred: false}
      - {glob: "SRIRs_*/**/*.sofa", pattern: 'SRIRs_(?P<room>.+)_(?P<rcv>[EMW])\.sofa$',
         capture_format: sdm_array, reference_role: mic_0}
keep_archive: false
wave: 1
homepage: https://zenodo.org/records/19809790
doi: 10.5281/zenodo.19809790
status: active
web_check:
  checked: '2026-10-14'
  institution: TU Ilmenau
  country: Germany
  caveats:
  - Each BRIR file holds 72 head orientations for each of the 5 loudspeakers; rirdb analyses the frontal orientation
    only, and every SRIR.
