  size: 80.3 MB
  file_formats: ZIP of MATLAB .mat IR files (raw and processed) and .m scripts; README.pdf
  institution: University of Oldenburg (Auditory Signal Processing, Hearing4all)
  country: Germany
  evidence_urls:
  - https://zenodo.org/records/3736487
  - https://zenodo.org/api/records/3736487
  - https://zenodo.org/records/3736487/files/README.pdf?download=1
  - https://zenodo.org/api/records/3621283
