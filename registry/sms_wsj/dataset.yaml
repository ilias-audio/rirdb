  note: 'Zenodo 3517889: 35,875 examples (train_si284 33,561, cv_dev93 982, test_eval92 1,332, as in the paper), each its
    own simulated shoebox room with 4 source positions and a 6-microphone circular array (radius 10 cm), one 6-channel WAV
    per source (8 kHz, 1.024 s, not normalised). RIRDB counts one IR per source, the array as one 6-channel IR: 143,500
    IRs (861,000 single-microphone responses). The SMS-WSJ mixtures use sources 0 and 1 of each room; sources 2 and 3 are
    published and indexed as well.'
