    8 kHz, 2^13 taps, c = 343 m/s, rirgen; sms_wsj/reverb/scenario.py: the geometry); arXiv 1910.13934 (the simulation)'
license:
  spdx: CC-BY-4.0
notes: "The T60 in each room's label is the value given to the generator, which sets the wall reflection from Sabine's
  formula. An image-source room with uniform walls then decays a little more slowly the longer its T60: RIRDB's rt_mid
  reads a median 1.11 times the label (0.93 at 0.2-0.25 s, 1.19 at 0.45-0.5 s). An image-source calculation of the
  same rooms gives the same values (rt_mid over calculated T30: median 1.01, p10-p90 0.95-1.09)."
