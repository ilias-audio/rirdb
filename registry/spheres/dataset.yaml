- 48000
content: Measured RIRs from a loudspeaker at 17 instrument positions to the 23 studio microphones of an orchestral
  session in the main room of The Spheres studio (Italy), as NumPy arrays with plots.
expected:
  n_irs: 374
  n_rooms: 1
  note: '17 loudspeaker positions x 23 microphones = 391 rows in the 17 .npy files; row 5 (Close_spot, the spot microphone
    moved to each instrument) holds no IR in any file, so 17 x 22 = 374 are read: 85 from the five omni microphones (ambient
    pair, mains) and 289 from the 17 cardioid section spots. The RIR sampling rate is not stated; 48 kHz is the rate of
    the session''s recordings.'
room_info:
  dimensions: 'yes'
  volume: 'yes'
  positions: partial
  reference_acoustics: partial
  where: 'paper (arXiv 2511.21247): room size 15 x 9 x 8 m and treatment, the 23 microphones (Table II), loudspeaker at
