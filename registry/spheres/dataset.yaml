  caveats:
  - RIRs are NumPy .npy arrays, not WAV; the RIR sample rate is not stated (the music recordings are 48 kHz). The
    391 count is 17 positions x 23 microphones.
  - Download TheSpheresDataset-RIRs.zip (24 MB) on its own; the raw claps and sweeps are 18.6 GB and the music audio
    about 28 GB.
  - Measured with sweeps from a directional studio monitor (Neumann KH120 II); the authors say the method does not
    fully follow the measurement standard.
