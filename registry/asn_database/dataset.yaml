# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: asn_database
name: ASN Database v3.2
year: 2023
type: simulated
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3   # onboarded by scripts/onboard
source: {kind: zenodo, records: ["8320987"]}
adapter: {name: asn_json, params: {json: ASN_Database_3.2_WAV/OUT/RIR.json}}
capture_formats:
- array_raw
content: 79,184 simulated RIRs (CATT-Acoustic, image sources + cone tracing) for 202 sources and 98 four-microphone
  nodes on grids in a 5-room holiday-apartment model of the flat used for DCASE recordings.
fs_hz:
- 44100
expected:
  n_irs: 19796
  n_rooms: 5
  note: 'The authors count 79,184 single-channel RIRs (202 sources x 392 microphones on 98 four-microphone nodes); RIRDB
    joins each node''s 4 files into one 4-channel IR: 19,796. The WAV, BIN and MAT folders hold the same RIRs; only the
    WAV copy is read. The space is the room of the node; the sources lie on a 40 cm grid over the whole apartment, so many
    IRs have the source in another room. The files are 0.35-0.38 s long while T30 is 0.31-0.46 s, so most end before the
    level has fallen 60 dB and decay times beyond about T20 may be limited by the length. Three pairs have the source within
    9 cm of the node centre (B0 at node 9, B5 at node 12, C0 at node 18; 1.3-5.4 cm from the nearest microphone), with float
    peaks of 19-78.'
room_info:
  dimensions: partial
  geometry: 'yes'
