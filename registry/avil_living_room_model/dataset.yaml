# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: avil_living_room_model
name: Living-room model and simulated IRs (DTU AVIL, ODEON)
year: 2019
type: simulated
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3   # onboarded by scripts/onboard
source: {kind: figshare, records: ["9746324"]}
adapter: {name: wav_tree, params: {glob: loudspeakerIRs/*.wav, pattern: '^loudspeakerIRs/IR(?P<src>\d+)\.wav$', room_from: pattern, room_default: living_room, channel_formats: {64: array_raw}}}
ir_kinds:
- virtual
space_type: virtual
capture_formats:
- array_raw
fs_hz:
- 48000
analysis:
  reference_role: mean
content: 21 room impulse responses of a living room simulated in ODEON (7 azimuths x 3 distances) and rendered with
  the LoRA toolbox for DTU's 64-channel loudspeaker lab, with the ODEON room model and outputs.
expected:
  n_irs: 21
  n_rooms: 1
  note: 7 azimuths (-90 to 90 degrees, 30-degree steps) x 3 distances (1.4, 2.4, 3.4 m), as the figshare record states;
    IR01 is -90 degrees at 1.4 m and IR21 is 90 degrees at 3.4 m. Each IR is 64 loudspeaker feeds for DTU's AVIL (LoRA rendering).
room_info:
  dimensions: partial
  geometry: 'yes'
  positions: 'yes'
  images: 'no'
  conditions: 'no'
  where: the figshare record (azimuths, distances, IR numbering); AVcocktailpartyRoomODEON/AVcocktailpartyRoom/AVcocktailpartyRoom.SouRecScript
    (source and listener coordinates) and AVcocktailpartyRoom.Materials.00001.txt (surface areas and absorption coefficients)
license:
  spdx: CC-BY-4.0
homepage: https://data.dtu.dk/articles/dataset/A_room_acoustics_model_and_simulated_impulse_responses_of_a_living_room/9746324
doi: 10.11583/DTU.9746324
web_check:
  checked: '2026-10-14'
  found_as: DTU simulated living-room IRs for the Audio-Visual Immersion Lab (ODEON)
  availability: open
  families:
  - array
  host: figshare (DTU Data)
  size: 62 MB
  file_formats: 'Two ZIP archives: loudspeaker IRs; ODEON room model and raw ODEON output files'
  institution: Technical University of Denmark (DTU), Hearing Systems
  country: Denmark
  evidence_urls:
  - https://api.figshare.com/v2/articles/9746324
  - https://ndownloader.figshare.com/files/17458448
  - https://ndownloader.figshare.com/files/17458403
  - https://doi.org/10.11583/DTU.9746324
  confidence: high
  caveats:
  - The IRs are loudspeaker feeds for DTU's 64-channel lab (AVIL), not mono or binaural IRs.
  - Using the room model needs ODEON, a commercial program.
  - The record does not say which file format the IRs are stored in.
