# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: tugraz_speech_rirs
name: Dataset of Room Impulse Responses for Realistic Speech Data
year: 2024
type: measured
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3   # onboarded by scripts/onboard
source: {"kind":"http","urls":["https://repository.tugraz.at/records/f6q9h-fc803/files/rir_dataset.zip?download=1"]}
adapter: {name: tugraz_rir_bin, params: {rooms: [classroom, corridor], fs: 48000, src_z: 1.21, labels: {classroom: 'Classroom, Signal Processing and Speech Communication Laboratory, TU Graz', corridor: 'Large corridor, Signal Processing and Speech Communication Laboratory, TU Graz'}}}
capture_formats:
- array_raw
defects:
- what: Corridor source positions near the array do not match the direct-sound delays (sources published 0.1-0.5 m from
    the array arrive with the same delay; delay vs published distance has slope 0.83, classroom 0.97), so corridor distances
    below about 1 m are unreliable
  files: ^data/corridor/
content: 16-channel circular-array RIRs measured with a robot-moved loudspeaker on fine grids in a classroom (97
  points) and a large corridor (210 points), 4 source directions per point, for simulating moving talkers.
fs_hz:
- 48000
expected:
  n_irs: 1228
  n_rooms: 2
  note: 97 positions x 4 source directions in the classroom (388), 210 x 4 in the corridor (840; one grid point, near (1.36,
    0.75), was measured twice about 5 h apart at positions 1.9 cm apart, so the 210 positions cover 209 grid points, and
    both are kept); each IR is one 16-channel circular-array recording (radius 0.275 m), 5 s at 48 kHz. The six WAV files
    are speech examples, not IRs.
room_info:
  dimensions: 'no'
  volume: 'no'
  geometry: partial
  materials: 'no'
  positions: 'yes'
  images: partial
  reference_acoustics: 'no'
  conditions: 'no'
  where: data/<room>/meta.json (array position, radius, rotation, wall outline) and data/<room>/index (source x, y, facing
    angle); fileio.py; Fragner et al., Data in Brief 2024 (PMC10912595) for the grids and the about 121 cm source height
license:
  spdx: CC-BY-4.0
homepage: https://repository.tugraz.at/records/f6q9h-fc803
doi: 10.3217/f6q9h-fc803
web_check:
  checked: '2026-10-14'
  found_as: TU Graz dataset of room impulse responses for realistic speech data (Fragner et al.)
  availability: open
  families:
  - array
  host: University repository (TU Graz Repository)
  size: 17.5 GB
  file_formats: Custom binary (meta.json, index and data files; Python reader) in one ZIP
  institution: Graz University of Technology
  country: Austria
  evidence_urls:
  - https://repository.tugraz.at/records/f6q9h-fc803
  - https://repository.tugraz.at/api/records/f6q9h-fc803
  - https://repository.tugraz.at/api/records/6na1n-ap123
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC10912595/
  confidence: high
  caveats:
  - 'Large: a single 17.5 GB ZIP.'
  - IRs are stored in a custom binary format read with the authors' Python script, not as WAV files.
  - This is version 2 (2024); version 1 (2023) has DOI 10.3217/6na1n-ap123.
