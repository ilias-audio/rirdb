notes: "The authors ran noise reduction (noisereduce, with each recording's first 2 s as the noise profile) on every
  sweep recording before deconvolution, so the IRs fall 70-130 dB at mid frequencies and hold nothing above about 15
  kHz. The 4 and 8 kHz bands end in a slowly decaying floor 45-55 dB down, so T30 at 8 kHz (0.9-1.35 s) reads 0.2-0.6
  s above T20 and is not a room value. The stored RT60 is the authors' 500 Hz-1 kHz fit from 0 to -60 dB."
