content: 2M+ synthetic RIRs in 6.8K professionally designed 3D houses, geometric ray tracing calibrated with FDTD wave simulation below the crossover.
expected:
  n_irs: 56773
  n_rooms: 5699
  note: 'RIRDB holds the authors'' small subset, GWA_Dataset_small.zip (15.4 GB). download/README.md describes it as "about
    56,000 IRs, sampling <=10 IRs in each scene". It has 56,773 IRs in 5,699 3D-FRONT houses: 10 in each of 5,654 houses,
    1 to 9 in the other 45. The full GWA (GWA_Dataset.zip, 488 GB) holds about 2 million IRs in 18,968 furnished rooms of
    6,813 houses (paper); it was not downloaded. RIRDB counts the house as the space, because each house was simulated whole
    with open doors between its rooms and stats.csv names no room. Hybrid simulation: FDTD wave simulation below 1.4 kHz,
    geometric simulation above. 48 kHz, 1.5 s (5,594 files up to 3.0 s), not normalised (energy calibrated to 1 at 1 m).'
license: {spdx: CC-BY-NC-4.0, redistribute_audio: yes, note: "GitHub README: dataset CC BY-NC 4.0, code CC BY 4.0; the 3D-FRONT models fall under their own licence agreement (checked 2026-10-13)."}
notes: "RIRDB's octave-band T30 matches the authors' T60 in stats.csv within about 1 % (median) in every octave from
  250 Hz to 8 kHz; at 125 Hz the median ratio is 1.01 (p90 1.26). rt_mid over the CSV's 500 Hz-1 kHz mean has a median
  of 1.000 (p10-p90 0.99-1.01, 56,542 IRs). The decay times follow the materials the simulation gave each house, not
  typical furnished homes. House medians run from 0.06 to 3.1 s (p1-p99 0.14-1.75 s). 28 houses read under 0.1 s, with
  a DRR of about +17 dB and C50 of about 37 dB at 3 m, so they are nearly anechoic; 26 read over 2 s. T30 often drops
  across the 1.4 kHz crossover between the wave and the geometric solver: the 2 kHz octave reads a median 0.88 times
  the 1 kHz octave, 0.55 or less in 10 % of IRs, and as little as a fifth in a few. stats.csv shows the same drop. The
  tails end in a numerical floor 150-200 dB below the peak, because the rays stop below the threshold of hearing. On
  this floor analyser v1's noise search fails in some bands. The 4 kHz T30 is empty in 9,443 IRs and the 8 kHz T30 in
  27,864, so 9,160 IRs grade B instead of S. On the same floor, components below 60 Hz, 70-125 dB below the peak,
  raise the tonal flag on 584 IRs; 571 of them grade C for it, and their decay times still match stats.csv."
homepage: https://gamma.umd.edu/pro/sound/gwa/
