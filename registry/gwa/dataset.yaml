  files: /(f655b350[^/]*/(L5_R0050)|32d0cdae[^/]*/(L1_R0016|L1_R0017|L2_R0053|L3_R0027|L3_R0040|L5_R0032)|cc3db277[^/]*/(L5_R0024)|a107277b[^/]*/(L2_R0003)|88036aee[^/]*/(L3_R0030|L4_R0027|L4_R0055)|605034c1[^/]*/(L1_R0137|L3_R0007|L4_R0017|L4_R0131)|5c0a1757[^/]*/(L2_R0002)|30c0c5d6[^/]*/(L4_R0894)|fe74af37[^/]*/(L3_R0014)|bacde876[^/]*/(L2_R0023))\.wav$
