  where: 'GWA_Dataset_small/stats.csv: per IR, T60_125Hz to T60_8000Hz (python-acoustics) and Source_Pos and Receiver_Pos
    (metres, the house model''s frame, y up). github.com/GAMMA-UMD/GWA: download/README.md (the layout); tools/sample_src_lis.py
    (1 m grid, 0.2 m clearance; 5 sources per house); tools/json2obj.py (the house mesh, rebuilt from 3D-FRONT, which must
    be obtained separately under its own licence agreement); tools/assign_mats.py with files/acoustic_absorptions.json (the
    material library; the materials given to each house are not published); simulation/sim_gsound.py (48 kHz, not normalised).
    Paper (arXiv 2204.01787): the 1,400 Hz crossover, the 1.5 s simulation, the energy calibration at 1 m, and a figure
    of house volume against reverberation time.'
defects:
- what: 'No sound above about 1.4 kHz, and very faint: in the simulation, no geometric path joined the source and the receiver.
    The geometric simulation gives everything above the 1.4 kHz crossover, so only a faint low-frequency part of the wave
    simulation arrived. In these files the energy above 2 kHz is 52 to 99 dB below the energy under 1 kHz (the median IR:
    8 dB above), and the peaks are -66 to -220 dBFS (the median IR: -32 dBFS). Octave-band values above 1 kHz are noise.
    For 14 of these files, stats.csv gives a failed T60 fit (0 s or over 10 s).'
  files: /(32d0cdae[^/]*/(L1_R0016|L1_R0017|L2_R0053|L3_R0027|L3_R0040)|0493bba4[^/]*/(L2_R0073)|cc3db277[^/]*/(L2_R0029|L5_R0024)|d86d22b5[^/]*/(L4_R0018)|67dd6924[^/]*/(L5_R0113)|88036aee[^/]*/(L3_R0030|L3_R0060|L4_R0027|L4_R0039|L4_R0055)|605034c1[^/]*/(L1_R0137)|d7da27dc[^/]*/(L3_R0003)|5c0a1757[^/]*/(L2_R0002|L2_R0027|L2_R0046)|c1117917[^/]*/(L2_R0010|L2_R0017|L3_R0010|L3_R0017|L4_R0010|L4_R0017)|750af363[^/]*/(L2_R0001|L4_R0001|L4_R0002)|c49b0591[^/]*/(L3_R0040|L4_R0038)|15de4a4c[^/]*/(L3_R0055))\.wav$
- what: The level does not fall 20 dB between the peak and the end of the 1.5 s file. The median IR falls 83 dB. These are
    faint IRs (peaks -61 to -145 dBFS) whose peak comes late (0.03 to 1.16 s) or whose decay the file end cuts off, so decay
