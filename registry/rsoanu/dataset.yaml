# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: rsoanu
name: RSoANU RIR dataset
year: 2024
type: measured
ir_kinds: [room]
capture_formats: [foa_fuma, em32_raw]
content: Multichannel RIRs of one recording studio at the Australian National University with felt or wood panels on two adjacent walls, for 3 source positions and a planar receiver grid (7 x 7 m at 1 m spacing plus finer points near each source, at 1.7 m), recorded with a Rode NT-SF1 (B-format, FuMa normalisation) and an Eigenmike em32; 48 kHz, 1.5 s.
room_info: {positions: "yes", images: "yes", conditions: "yes", where: "RSoANU_Documentation_v2.pdf: source coordinates (Table 1), receiver grid (Tables 2 and 3), panoramas of the studio; felt and wood wall panels"}
license: {spdx: CC-BY-4.0, redistribute_audio: yes}
access: open
source: {kind: zenodo, records: ["10720345"]}
adapter:
  name: wav_tree
  # <Felt|Wood>_Source<n>/WAV Files/RIR_S<n>_R<pos>.wav; B-format (Rode NT-SF1) preferred over the em32 copy
  params:
    pattern: 'RSoANU_RIRs_(?P<array>Bformat|em32)[^/]*/[^/]+/(?P<cond>Felt|Wood)_(?P<src>Source\d)/WAV Files/RIR_S\d_(?P<rcv>R[^/]+)\.wav$'
    room_from: pattern
    room_default: rsoanu-room
    roles: {4: [W, X, Y, Z], 32: [c1, c2, c3, c4, c5, c6, c7, c8, c9, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19, c20, c21, c22, c23, c24, c25, c26, c27, c28, c29, c30, c31, c32]}
    channel_formats: {4: foa_fuma, 32: em32_raw}
    sh_norm: FuMa                  # NT-SF1 B-format (RSoANU_Documentation_v2.pdf, section 3)
    reference_roles: {32: mean}
    orientation_known: false
    preferred_regex: RSoANU_RIRs_Bformat
keep_archive: false
wave: 2
homepage: https://zenodo.org/records/10720345
doi: 10.5281/zenodo.10720345
status: active
notes: "The NT-SF1 files are B-format with FuMa normalisation (RSoANU_Documentation_v2.pdf, section 3). Indexed as FuMa since 15 Nov 2026, so get delivers them as AmbiX with W raised by 3 dB. Analyser v1 measured them as AmbiX: its lateral fraction is about twice too high, and is not published (the orientation is unknown); decay, clarity and DRR use W alone and are not affected."
web_check:
  checked: '2026-10-14'
  institution: Australian National University
  country: Australia
  caveats:
  - '16-bit files recorded at a low level: the tails round to zero 45 to 65 dB below the peak.'
  - The Eigenmike archive must be repaired (zip -FF) before it extracts.
