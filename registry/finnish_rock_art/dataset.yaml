notes: "Open-air IRs: the direct sound (a pop 5 m away, or the sweep IR) stands 13-21 dB above everything else, the
  painted cliff returns one distinct echo at twice its distance over the speed of sound (170 ms at 29 m, about 260 ms
  at 44 m) 15-34 dB down, and a weak tail from the surroundings decays into the noise within 0.5-2 s. The decay curve
  is a staircase, so T20 and T30 disagree (Kalamaniemi 0.09 and 3.3 s) and rt_mid is not a reverberation time of the
  site; the echo delay and level describe these sites better."
