# Dataset file (docs/decisions/data-model.md, section 7). Fields and allowed values: src/rirdb/registry.py.
id: dtu_frequency_responses
name: DTU acoustic frequency responses (classroom)
year: 2021
type: measured
status: active   # onboarded by scripts/onboard; reviewed on 16-17 Nov 2026 (tier B review, reports/onboarding/notes.tsv)
access: open
wave: 3   # onboarded by scripts/onboard
source: {kind: figshare, records: ["13315286"]}
adapter: {name: h5_freqresp, params: {glob: classroom_frequency_responses.h5, pattern: '(?P<room>classroom)_frequency_responses\.h5$', sets: 'aperture_(?P<set>z\d+mm)/response', freq_axis: 0, frequency: frequency, positions: xyz, pos_scale: 0.001}}
capture_formats:
- mono_omni
fs_hz:
- 10000
analysis:
  keep_s: 0.8
content: Complex room frequency responses (0-5 kHz in 1 Hz steps) measured with a robot-positioned microphone at 4,761 points
  of a 25 mm planar grid (1.7 x 1.7 m at z = 1866 mm) in DTU classroom 019, stored as HDF5 (record DTU.13315286). RIRDB
  turns each response into a 1 s IR at 10 kHz by inverse FFT. The authors' empty cuboid room (2,023 points) is a separate
  record, DTU.13315289, which is not included.
expected:
  n_irs: 4761
  n_rooms: 1
  note: 'The classroom record (DTU.13315286) only: one IR per point of the one aperture published (z = 1866 mm, 4,761 of
    the 7,211 points measured), each computed by inverse FFT of the published frequency response (1 s at 10 kHz, content
    to 5 kHz). The empty cuboid room (record DTU.13315289, 2,023 points) is not included.'
room_info:
  dimensions: 'yes'
  volume: 'yes'
  geometry: partial
  materials: partial
  positions: partial
  images: 'yes'
  reference_acoustics: partial
  conditions: 'no'
  where: classroom_readme.md (room size, T60, setup) and classroom_sketch.pdf (axes from a floor corner, the aperture, the
    loudspeaker drawn in a far corner); receiver positions in the HDF5 file (xyz, mm); no source position is published (the
    readme says only a room corner)
license:
  spdx: CC-BY-4.0
homepage: https://data.dtu.dk/articles/dataset/Acoustic_frequency_responses_in_a_conventional_classroom/13315286
doi: 10.11583/DTU.13315286
web_check:
  checked: '2026-10-14'
  found_as: DTU acoustic frequency responses (conventional classroom; empty cuboid room)
  availability: open
  families:
  - mono
  host: figshare (DTU Data)
  size: 708 MB
  file_formats: HDF5 (complex frequency-domain responses per position), PDF sketch and photo, Markdown readme
  institution: Technical University of Denmark (DTU), Acoustic Technology
  country: Denmark
  evidence_urls:
  - https://api.figshare.com/v2/articles/13315286
  - https://api.figshare.com/v2/articles/13315289
  - https://ndownloader.figshare.com/files/27505451
  - https://ndownloader.figshare.com/files/27506717
  - https://doi.org/10.11583/DTU.13315286
  - https://api.figshare.com/v2/articles/25867705
  - https://api.figshare.com/v2/articles/14320166
  confidence: medium
  caveats:
  - Stored as frequency responses (to 5 kHz for the classroom, 10 kHz for the empty room), not as time-domain IR
    files.
  - The classroom readme says 7,211 positions were measured but documents only the 4,761-point aperture (z = 1866
    mm) in the file.
  - Published as two records with separate DOIs (classroom 10.11583/DTU.13315286, empty room 10.11583/DTU.13315289).
