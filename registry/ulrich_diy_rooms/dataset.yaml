analysis:
  keep_s: 1.5
content: Sine-sweep IRs (13 WAV files) of the bathroom, bedroom/foyer and dining room of the author's apartment,
  from a DIY capture tutorial using PreSonus Eris 4.5 monitors and two Shure SM-81 mics.
expected:
  n_irs: 12
  n_rooms: 3
  note: 13 files on the page; ir_wire_scarlett2i2 is a loopback through the Focusrite Scarlett 2i2 interface (0.05 s), not
    a room, and is left out. The five short files (bathroom1, bathroom2, bedroomfoyer, bedroomfoyer_1, diningroom) were
    faded by the author to digital silence, so their decay range (78-105 dB) shows the fade, not the recording's noise
    floor, which is 63-73 dB below the peak in the 2 s files; their decay times are not affected.
