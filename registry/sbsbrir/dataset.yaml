content: Measured BRIRs from a B&K head-and-torso simulator at 15 listener positions in the University of Salford's ITU-R
  BS.1116 listening room, for 12 loudspeakers in a ring, with the torso turned in 2° steps (the files add 1° steps interpolated
  by the authors, which RIRDB does not index).
