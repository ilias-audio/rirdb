notes: 'The record calls these 44.1 kHz RIRs, but they were simulated at 16 kHz: the direct sound arrives distance / c x
  16,000 samples after the start (median 15,980 samples per second on 149 omni files with the source inside the room) and
  each file is RT60 x 16,000 samples long, within 8 samples. The .npy files store no rate, so RIRDB reads them at 16 kHz;
  content goes up to 8 kHz only, and rirdb get delivers 16 kHz IRs, not the 44.1 kHz filters VoiceFixer convolved them with.
  Read at 44.1 kHz, every room would be 2.76 times smaller and every decay 2.76 times shorter than its file name states.
  The files end at the stated RT60, so the late decay is cut, and decay times fitted at 16 kHz are about 1.25 times the
  named RT60 (median). Coordinates are in the file names'' order: x is the README''s height axis, then width, then length.
  The cardioid microphones face +x (the cardioid to omni direct level fits 0.5 + 0.56 x the direction cosine on x). 11,999
  files put the source more than 5 mm below zero on an axis, outside the room (up to 2.95 m); no source lies beyond a far
  wall and no microphone outside the room. Another 34 sources are written -0.0, within 5 mm outside a wall, and are not
  marked. The README says the source distance was redrawn above 5 m, but 7,526 files (all with the source inside the room)
  name a source more than 5 m from the microphone, up to 14.8 m; their direct sound arrives at the named distance (300 sampled
  files), so the names, not the README, give the geometry. The ratio of RIRDB''s mid T30 to the named RT60 grows with the
  room''s proportions: 1.14 (median) where the longest side is at most twice the shortest, 1.35 up to 4 times, 1.7 up to 8
  times and 2.0 beyond, as an image-source room with one absorption on all walls gives in disproportionate rooms. 15,851
  files (32 %) have no mid decay time because they end at the named RT60, and the 816 files of 0.05-0.08 s give no values
  at all.'
defects:
- what: 'The source named in the file lies outside the room (a coordinate below zero, by up to 2.95 m), so the stated source
    position and distance do not match the IR: its first strong arrival comes earlier, from the source''s mirror image across
    the wall at zero.'
  files: _source_(?:[^_]+_){0,2}-(?!0\.0(?:_|\.npy$))
content: Simulated single-microphone RIRs (43,239 stated, 50,000 in the archive) from random rectangular rooms (sides 1-12
  m, RT60 0.05-1 s, omni or cardioid microphone), released with the VoiceFixer speech-restoration paper as 44.1 kHz filters
  but simulated at 16 kHz.
fs_hz:
- 16000
expected:
  n_irs: 43239
  note: The README and the VoiceFixer paper state 43,239 (38,239 train + 5,000 test); RIR_44k.zip (Zenodo record 5528124)
    holds 45,000 train and 5,000 test files, all 50,000 distinct (no checksum or name repeats), and every one is indexed,
    as nothing says which 38,239 the paper's training set holds. The example folder's .npy is a copy of a test file and
    is not read.
