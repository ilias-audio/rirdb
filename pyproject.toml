[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rirdb"
version = "0.0.1"
description = "Find, select, download and verify room impulse responses from public datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilias Ibnyahya" }]
requires-python = ">=3.9"
keywords = ["room impulse response", "reverberation", "room acoustics", "dataset", "audio"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/ilias-audio/rirdb"

[project.scripts]
rirdb = "rirdb:main"
